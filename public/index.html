<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1730" />
  <meta name="description" content="Sistema de inventario y punto de venta" />
  <title>Inventario &amp; POS</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    // Aplica el tema guardado ANTES de pintar (evita parpadeo)
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root">
    <div class="loading-block" style="min-height:100vh"><span class="spinner"></span></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modals"></div>

  <!-- Librerías (servidas localmente desde /vendor) -->
  <script src="/vendor/lucide.js"></script>
  <script src="/vendor/motion.js"></script>
  <script src="/vendor/chart.js"></script>
  <script src="/js/main.js?v=2" type="module"></script>
  <noscript>Este sistema necesita JavaScript habilitado.</noscript>
</body>
</html>
